apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../platform
patches:
  - target:
      kind: Application
      name: (keycloak|traefik)
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: refactor/unify-k3s-platform
  - target:
      kind: Application
      name: (argocd|harbor|arc-controller|arc-runners|longhorn|alloy)
    patch: |-
      - op: replace
        path: /spec/sources/1/targetRevision
        value: refactor/unify-k3s-platform

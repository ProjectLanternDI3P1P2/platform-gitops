name: Reusable - Publish and promote image

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      image:
        required: true
        type: string
      prebuild_on_github:
        description: Build the image on a GitHub-hosted runner, then transfer it to the Harbor runner.
        required: false
        type: boolean
        default: false
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_TOKEN:
        required: true
      GITOPS_DISPATCH_TOKEN:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  prebuild:
    if: ${{ inputs.prebuild_on_github }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Build image outside the restricted network
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lantern-prebuilt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}

      - name: Export prebuilt image
        shell: bash
        run: docker save "lantern-prebuilt:${GITHUB_SHA}" | gzip -1 > prebuilt-image.tar.gz

      - name: Upload prebuilt image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-image-${{ github.run_id }}
          path: prebuilt-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: prebuild
    if: ${{ always() && (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped') }}
    runs-on: lantern-k3s-builders
    env:
      REGISTRY: registry.lantern.diiage
      IMAGE: ${{ inputs.image }}
      APPLICATION: ${{ inputs.application }}
      GITOPS_REPOSITORY: ProjectLanternDI3P1P2/platform-gitops
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute immutable tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            deploy_tag="${GITHUB_REF_NAME}"
            tags="${IMAGE}:${deploy_tag}"
          else
            deploy_tag=""
            tags="${IMAGE}:main-${short_sha}"$'\n'"${IMAGE}:main-latest"
          fi
          {
            echo "deploy_tag=${deploy_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Download prebuilt image
        if: ${{ inputs.prebuild_on_github }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prebuilt-image-${{ github.run_id }}

      - name: Load, tag and push prebuilt image
        if: ${{ inputs.prebuild_on_github }}
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          gzip -dc prebuilt-image.tar.gz | docker load
          while IFS= read -r tag; do
            docker tag "lantern-prebuilt:${GITHUB_SHA}" "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"

      - name: Build and push
        if: ${{ inputs.prebuild_on_github == false }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            github_token=${{ github.token }}

      - name: Verify published image
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag" >/dev/null
            echo "Verified ${tag}"
          done <<< "${TAGS}"

      - name: Request GitOps promotion
        if: github.ref_type == 'tag'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = process.env.GITOPS_REPOSITORY.split('/');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'promote-image',
              client_payload: {
                application: process.env.APPLICATION,
                image: process.env.IMAGE,
                tag: '${{ steps.image.outputs.deploy_tag }}',
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_revision: context.sha
              }
            });

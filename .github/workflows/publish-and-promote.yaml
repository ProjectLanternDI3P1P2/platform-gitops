name: Reusable - Publish and promote image

on:
  workflow_call:
    inputs:
      application:
        required: true
        type: string
      image:
        required: true
        type: string
      prebuild_on_github:
        description: Build the image on a GitHub-hosted runner, then transfer it to the Harbor runner.
        required: false
        type: boolean
        default: false
      build_args:
        description: Newline-delimited Docker build arguments for public, build-time application configuration.
        required: false
        type: string
        default: ""
    secrets:
      HARBOR_USERNAME:
        required: true
      HARBOR_TOKEN:
        required: true
      GITOPS_DISPATCH_TOKEN:
        required: true
      COSIGN_PRIVATE_KEY:
        required: true
      COSIGN_PASSWORD:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  prebuild:
    if: ${{ inputs.prebuild_on_github }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Build image outside the restricted network
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lantern-prebuilt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            github_packages_credentials=Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic

      - name: Export prebuilt image
        shell: bash
        run: docker save "lantern-prebuilt:${GITHUB_SHA}" | gzip -1 > prebuilt-image.tar.gz

      - name: Upload prebuilt image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prebuilt-image-${{ github.run_id }}
          path: prebuilt-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    needs: prebuild
    if: ${{ always() && (needs.prebuild.result == 'success' || needs.prebuild.result == 'skipped') }}
    runs-on: lantern-k3s-builders
    env:
      REGISTRY: 10.4.111.200:18443
      IMAGE: ${{ inputs.image }}
      APPLICATION: ${{ inputs.application }}
      GITOPS_REPOSITORY: ProjectLanternDI3P1P2/platform-gitops
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute immutable tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${IMAGE}" != "${REGISTRY}/lantern/"* ]]; then
            echo "Image must use ${REGISTRY}/lantern/" >&2
            exit 1
          fi
          short_sha="$(git rev-parse --short=12 HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            deploy_tag="${GITHUB_REF_NAME}"
            tags="${IMAGE}:${deploy_tag}"
          else
            deploy_tag=""
            tags="${IMAGE}:main-${short_sha}"$'\n'"${IMAGE}:main-latest"
          fi
          {
            echo "deploy_tag=${deploy_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Log in to Harbor
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_TOKEN }}

      - name: Download prebuilt image
        if: ${{ inputs.prebuild_on_github }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: prebuilt-image-${{ github.run_id }}

      - name: Load, tag and push prebuilt image
        if: ${{ inputs.prebuild_on_github }}
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          gzip -dc prebuilt-image.tar.gz | docker load
          while IFS= read -r tag; do
            docker tag "lantern-prebuilt:${GITHUB_SHA}" "${tag}"
            docker push "${tag}"
          done <<< "${TAGS}"

      - name: Build and push
        if: ${{ inputs.prebuild_on_github == false }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ inputs.build_args }}
          secrets: |
            github_packages_credentials=Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic

      - name: Verify published image
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools inspect "$tag" >/dev/null
            echo "Verified ${tag}"
          done <<< "${TAGS}"

      - name: Resolve image digest
        id: digest
        shell: bash
        env:
          TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail
          first_tag="$(printf '%s\n' "${TAGS}" | head -n1)"
          digest="$(docker buildx imagetools inspect "${first_tag}" --format '{{ .Manifest.Digest }}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${first_tag}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Image digest: ${digest}"

      # Scan gate: Harbor scans on push (project setting). Wait for the result and fail on CRITICAL.
      # The signature step below only runs if this step succeeds ("scan before sign").
      - name: Enforce Harbor vulnerability scan gate
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null || { echo "jq is required on the runner" >&2; exit 1; }
          repository="${IMAGE#"${REGISTRY}"/lantern/}"
          url="https://${REGISTRY}/api/v2.0/projects/lantern/repositories/${repository}/artifacts/${DIGEST}?with_scan_overview=true"
          for attempt in $(seq 1 30); do
            json="$(curl --fail-with-body -sS -u "${HARBOR_USERNAME}:${HARBOR_TOKEN}" \
              -H 'X-Accept-Vulnerabilities: application/vnd.security.vulnerability.report; version=1.1, application/vnd.scanner.adapter.vuln.report.harbor+json; version=1.0' \
              "${url}")"
            status="$(jq -r '(.scan_overview // {}) | to_entries | .[0].value.scan_status // "None"' <<< "${json}")"
            echo "Scan status (attempt ${attempt}/30): ${status}"
            case "${status}" in
              Success)
                critical="$(jq -r '(.scan_overview // {}) | to_entries | .[0].value.summary.summary.Critical // 0' <<< "${json}")"
                echo "CRITICAL vulnerabilities: ${critical}"
                if [[ "${critical}" -gt 0 ]]; then
                  echo "Image has ${critical} CRITICAL vulnerabilities: refusing to sign." >&2
                  exit 1
                fi
                exit 0
                ;;
              Error|Stopped)
                echo "Harbor scan did not succeed: refusing to sign." >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the Harbor scan: refusing to sign." >&2
          exit 1

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1 (last installer release of the cosign v2 line)
        with:
          cosign-release: 'v2.6.5'

      - name: Sign image by digest
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # Restricted network: no transparency log, key-based signature only.
          # --allow-insecure-registry: the internal Harbor uses a self-signed certificate.
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --allow-insecure-registry "${IMAGE}@${DIGEST}"

      # Provenance (T05.8): link the image digest to its source repository, commit and workflow run.
      # The attestation is signed with the same CI key and attached to the image in Harbor.
      # Note: it is generated by this workflow itself (SLSA v0.2 format, no isolated builder).
      - name: Attach signed provenance attestation
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${GITHUB_SHA}" \
            --arg ref "${GITHUB_REF}" \
            --arg server "${GITHUB_SERVER_URL}" \
            --arg run "${GITHUB_RUN_ID}" \
            --arg attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow "${GITHUB_WORKFLOW_REF}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg event "${GITHUB_EVENT_NAME}" \
            '{
              builder: { id: ($server + "/ProjectLanternDI3P1P2/platform-gitops/.github/workflows/publish-and-promote.yaml") },
              buildType: "https://github.com/ProjectLanternDI3P1P2/platform-gitops/publish-and-promote@v1",
              invocation: {
                configSource: { uri: ("git+" + $server + "/" + $repo + "@" + $ref), digest: { sha1: $sha }, entryPoint: $workflow },
                environment: { github_run_id: $run, github_run_attempt: $attempt, github_actor: $actor, github_event_name: $event }
              },
              metadata: {
                buildInvocationId: ($server + "/" + $repo + "/actions/runs/" + $run + "/attempts/" + $attempt),
                completeness: { parameters: false, environment: false, materials: false },
                reproducible: false
              },
              materials: [ { uri: ("git+" + $server + "/" + $repo + "@" + $ref), digest: { sha1: $sha } } ]
            }' > provenance.json
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --tlog-upload=false --allow-insecure-registry \
            --type slsaprovenance --predicate provenance.json "${IMAGE}@${DIGEST}"
          rm -f provenance.json

      - name: Verify signature
        shell: bash
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          # Public key of the CI signing key (not a secret).
          COSIGN_PUBLIC_KEY: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuzJkzYykYXv2YxnlsN1cMQeT2P3+
            I8YGkReMBpnrseyZKWJLQ+GEd0hcGiWbt99YmClZd55L7kXBDnvyoAjdkQ==
            -----END PUBLIC KEY-----
        run: |
          set -euo pipefail
          printf '%s\n' "${COSIGN_PUBLIC_KEY}" > cosign.pub
          cosign verify --key cosign.pub --insecure-ignore-tlog=true --allow-insecure-registry "${IMAGE}@${DIGEST}" >/dev/null
          echo "Signature verified for ${IMAGE}@${DIGEST}"
          # The provenance must be signed by the same key and must reference this commit.
          cosign verify-attestation --key cosign.pub --type slsaprovenance --insecure-ignore-tlog=true --allow-insecure-registry "${IMAGE}@${DIGEST}" \
            | jq -r '.payload' | base64 -d \
            | jq -e --arg sha "${GITHUB_SHA}" '.predicateType == "https://slsa.dev/provenance/v0.2" and .predicate.materials[0].digest.sha1 == $sha' >/dev/null
          echo "Provenance verified for ${IMAGE}@${DIGEST}"
          rm -f cosign.pub

      - name: Request GitOps promotion
        if: github.ref_type == 'tag'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
          script: |
            const [owner, repo] = process.env.GITOPS_REPOSITORY.split('/');
            await github.rest.repos.createDispatchEvent({
              owner,
              repo,
              event_type: 'promote-image',
              client_payload: {
                application: process.env.APPLICATION,
                image: process.env.IMAGE,
                tag: '${{ steps.image.outputs.deploy_tag }}',
                digest: '${{ steps.digest.outputs.digest }}',
                source_repository: context.repo.owner + '/' + context.repo.repo,
                source_revision: context.sha
              }
            });

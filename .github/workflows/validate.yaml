name: Validate GitOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Render Kubernetes configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.31.0

      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.18.6

      - name: Validate Kustomize overlays
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            kubectl kustomize "$(dirname "$file")" >/dev/null
          done < <(find . -type f \( -name kustomization.yaml -o -name kustomization.yml \) -not -path './.git/*')

      - name: Validate platform Helm charts
        shell: bash
        run: |
          set -euo pipefail
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add harbor https://helm.goharbor.io
          helm repo add longhorn https://charts.longhorn.io
          helm repo update
          helm template argocd argo/argo-cd --version 10.9.2 -n argocd --skip-crds \
            -f platform/argocd/values.yaml >/dev/null
          helm template harbor harbor/harbor --version 1.19.2 -n harbor --skip-crds \
            -f platform/harbor/values.yaml >/dev/null
          helm template alloy grafana/alloy --version 1.13.0 -n monitoring --skip-crds \
            -f observability/alloy/values.yaml >/dev/null
          helm template longhorn longhorn/longhorn --version 1.12.1 -n longhorn-system --skip-crds \
            -f platform/longhorn/values.yaml >/dev/null
          helm template arc oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller \
            --version 0.14.2 -n arc-systems --skip-crds \
            -f platform/actions-runner-controller/controller/values.yaml >/dev/null
          helm template lantern-k3s-builders oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
            --version 0.14.2 -n arc-runners --skip-crds \
            -f platform/actions-runner-controller/runners/values.yaml >/dev/null

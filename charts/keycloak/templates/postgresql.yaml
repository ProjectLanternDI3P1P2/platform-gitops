{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  labels:
    app.kubernetes.io/name: keycloak-postgresql
spec:
  selector:
    app.kubernetes.io/name: keycloak-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgresql
  labels:
    app.kubernetes.io/name: keycloak-postgresql
    {{- include "lantern-keycloak.labels" . | nindent 4 }}
spec:
  serviceName: keycloak-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgresql
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: volume-permissions
          image: "{{ .Values.postgresql.volumePermissionsImage.repository }}:{{ .Values.postgresql.volumePermissionsImage.tag }}"
          command: ["sh", "-ec", "chown -R 70:70 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
          env:
            - {name: POSTGRES_DB, value: keycloak}
            - {name: POSTGRES_USER, value: keycloak}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: "{{ .Values.postgresql.existingSecret }}", key: database-password}}
          ports:
            - {name: postgresql, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgresql.storage.storageClass | quote }}
        resources:
          requests: {storage: {{ .Values.postgresql.storage.size }}}
{{- end }}


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailpit-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.storageClass | quote }}
  resources:
    requests: {storage: {{ .Values.storage.size }}}
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
spec:
  selector: {app.kubernetes.io/name: mailpit}
  ports:
    - {name: http, port: 8025, targetPort: http}
    - {name: smtp, port: 1025, targetPort: smtp}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mailpit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mailpit}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mailpit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          env:
            - {name: MP_DATABASE, value: /data/mailpit.db}
            - {name: MP_MAX_MESSAGES, value: "500"}
            - {name: MP_ALLOWED_HOSTS, value: "{{ .Values.hostname }}"}
          ports:
            - {name: http, containerPort: 8025}
            - {name: smtp, containerPort: 1025}
          readinessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: mailpit-data}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailpit
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.hostname | quote }}]
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: mailpit, port: {name: http}}
{{- end }}


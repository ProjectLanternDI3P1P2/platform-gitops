# StorageClass pour les services avec état à instance unique (MongoDB, RabbitMQ).
#
# Différence avec longhorn-db : longhorn-db garde UNE copie car la redondance vient des
# 3 instances PostgreSQL. Ici il n'y a qu'un seul pod : la redondance doit donc venir
# de Longhorn, avec 3 copies réparties sur les 3 workers.
#
# Différence avec la classe "longhorn" par défaut : Retain au lieu de Delete, pour qu'une
# suppression accidentelle du PVC ne détruise pas les données.
#
# Ressource de niveau cluster, créée par l'application Argo CD cluster-foundation
# (synchronisation manuelle). La synchroniser AVANT mongodb et rabbitmq, sinon les PVC
# restent en Pending. Paramètres non modifiables une fois la classe créée.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-stateful
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  dataLocality: best-effort
  staleReplicaTimeout: "30"
  fsType: ext4

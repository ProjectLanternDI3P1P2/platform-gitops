apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    # Docker-in-Docker requires a privileged sidecar. Keep this exception
    # isolated from the controller and application namespaces.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

# cert-manager : certificats TLS internes, requis par le plugin Barman Cloud de CloudNativePG (US-10 T10.04).
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

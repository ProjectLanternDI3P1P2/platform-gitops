# Plugin Barman Cloud v0.16.0 (chart 0.9.0) pour CloudNativePG (US-10 T10.04). À synchroniser APRÈS cert-manager.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: lantern-platform
  name: plugin-barman-cloud
  namespace: argocd
spec:
  destination:
    namespace: cnpg-system
    server: https://kubernetes.default.svc
  project: lantern-platform-k3s
  sources:
  - chart: plugin-barman-cloud
    helm:
      releaseName: plugin-barman-cloud
      valueFiles:
      - $values/platform/plugin-barman-cloud/values.yaml
    repoURL: https://cloudnative-pg.github.io/charts
    targetRevision: 0.9.0
  - ref: values
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    # CRD volumineuses : l'application côté serveur évite la limite de taille des annotations.
    - ServerSideApply=true

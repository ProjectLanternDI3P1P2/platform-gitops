apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-kpis
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lantern-platform
spec:
  project: lantern-observability-k3s
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
    path: observability/devops-kpis/collector
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - FailOnSharedResource=true

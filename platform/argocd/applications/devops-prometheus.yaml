apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: lantern-platform
spec:
  project: lantern-platform-k3s
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.10.0
      helm:
        releaseName: lantern-kpi
        valueFiles:
          - $values/observability/devops-kpis/prometheus/values.yaml
    - repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
      targetRevision: main
      ref: values
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - FailOnSharedResource=true

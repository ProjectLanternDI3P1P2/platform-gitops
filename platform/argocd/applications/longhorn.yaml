apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: lantern-platform
  name: longhorn
  namespace: argocd
spec:
  destination:
    namespace: longhorn-system
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: ""
    jsonPointers:
    - /data
    - /stringData
    kind: Secret
  project: lantern-platform-k3s
  sources:
  - chart: longhorn
    helm:
      releaseName: longhorn
      skipCrds: true
      valueFiles:
      - $values/platform/storage/longhorn-values-observed.json
    repoURL: https://charts.longhorn.io
    targetRevision: 1.12.1
  - ref: values
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true

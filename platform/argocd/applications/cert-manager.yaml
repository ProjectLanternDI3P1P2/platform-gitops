# cert-manager (US-10 T10.04). À synchroniser AVANT plugin-barman-cloud.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: lantern-platform
  name: cert-manager
  namespace: argocd
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  project: lantern-platform-k3s
  sources:
  - chart: cert-manager
    helm:
      releaseName: cert-manager
      valueFiles:
      - $values/platform/cert-manager/values.yaml
    repoURL: https://charts.jetstack.io
    targetRevision: v1.21.3
  - ref: values
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    # CRD volumineuses : l'application côté serveur évite la limite de taille des annotations.
    - ServerSideApply=true

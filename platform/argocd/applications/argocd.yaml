apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: lantern-platform
  name: argocd
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: ""
    jsonPointers:
    - /data
    - /stringData
    kind: Secret
  project: lantern-platform-k3s
  sources:
  - chart: argo-cd
    helm:
      releaseName: argocd
      skipCrds: true
      valueFiles:
      - $values/platform/argocd/values-observed.json
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 10.9.2
  - ref: values
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true

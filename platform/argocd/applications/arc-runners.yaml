apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  labels:
    app.kubernetes.io/part-of: lantern-platform
  name: arc-runners
  namespace: argocd
spec:
  destination:
    namespace: arc-runners
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: ""
    jsonPointers:
    - /data
    - /stringData
    kind: Secret
  project: lantern-platform-k3s
  sources:
  - chart: gha-runner-scale-set
    helm:
      releaseName: lantern-k3s-builders
      skipCrds: true
      valueFiles:
      - $values/platform/actions-runner-controller/runners/values.yaml
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    targetRevision: 0.14.2
  - ref: values
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
  syncPolicy:
    syncOptions:
    - CreateNamespace=false
    - RespectIgnoreDifferences=true
    - FailOnSharedResource=true

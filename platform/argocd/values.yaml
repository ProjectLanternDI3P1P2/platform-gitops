# Desired configuration: provision Keycloak OIDC, its client Secret and TLS before sync.
# This includes planned settings that are not yet active on the cluster.
global:
  domain: 10.4.111.200
  nodeSelector:
    node-role.kubernetes.io/worker: worker

dex:
  enabled: false

redis:
  enabled: false
redis-ha:
  enabled: true
  image:
    repository: docker.io/library/redis
    tag: 8.6.4-alpine

configs:
  cm:
    url: https://10.4.111.200:8443
    admin.enabled: false
    exec.enabled: false
    oidc.config: |
      name: Keycloak
      issuer: https://groupe7.diiage.org/auth/realms/master
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  params:
    # Private pfSense forwarding to NodePort 30443; Argo CD terminates TLS.
    # Do not expose this endpoint through public NAT or public HAProxy.
    server.insecure: false
  rbac:
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, /platform-ops, role:admin
      p, role:developer, applications, get, */*, allow
      p, role:developer, logs, get, */*, allow
      g, /developers, role:developer

controller:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  ingress:
    enabled: false
  service:
    type: NodePort
    # pfSense forwards the approved external TCP port to this port on a K3s
    # worker. The HTTP-labelled service port also carries TLS while
    # server.insecure is false and must not be published by pfSense.
    nodePortHttp: 30080
    nodePortHttps: 30443
    externalTrafficPolicy: Cluster

applicationSet:
  replicas: 2

notifications:
  enabled: true

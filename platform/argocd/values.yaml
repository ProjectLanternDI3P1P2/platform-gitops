# Desired configuration: provision Keycloak OIDC, its client Secret and TLS before sync.
# This includes planned settings that are not yet active on the cluster.
global:
  domain: groupe7.diiage.org
  nodeSelector:
    node-role.kubernetes.io/worker: worker

dex:
  enabled: false

redis:
  enabled: false
redis-ha:
  enabled: true

configs:
  cm:
    url: https://groupe7.diiage.org/argocd
    admin.enabled: false
    exec.enabled: false
    oidc.config: |
      name: Keycloak
      issuer: https://groupe7.diiage.org/auth/realms/ops
      clientID: argocd
      clientSecret: $oidc.keycloak.clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
  params:
    server.insecure: true
  rbac:
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, /platform-ops, role:admin

controller:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}

repoServer:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

server:
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: groupe7.diiage.org
    path: /argocd
    pathType: Prefix
    tls: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web

applicationSet:
  replicas: 2

notifications:
  enabled: true

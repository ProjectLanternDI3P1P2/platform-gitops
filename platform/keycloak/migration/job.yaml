apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-database-migration
  namespace: keycloak
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:18.6-bookworm
          command: [bash, -euc]
          args:
            - |
              export PGCONNECT_TIMEOUT=5
              source_host=postgresql-keycloak.keycloak.svc.cluster.local
              target_host=postgres-rw.database.svc.cluster.local
              query() {
                psql -X -w -h "$1" -v ON_ERROR_STOP=1 -Atc "$2"
              }
              counts_sql='SELECT (SELECT count(*) FROM public.realm), (SELECT count(*) FROM public.client), (SELECT count(*) FROM public.user_entity)'
              source_counts=$(query "$source_host" "$counts_sql")
              target_tables=$(query "$target_host" "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p','S','v','m','f') AND n.nspname !~ '^pg_' AND n.nspname <> 'information_schema'")
              if [[ "$target_tables" != 0 ]]; then
                echo "Refusing migration into a non-empty target" >&2
                exit 1
              fi
              if [[ "$CHECK_ONLY" == true ]]; then
                echo "Source is readable and target is empty"
                exit 0
              fi
              pg_dump -w -h "$source_host" --format=custom --file=/archive/keycloak.dump
              pg_restore -w -h "$target_host" -d "$PGDATABASE" \
                --single-transaction --no-owner --no-acl /archive/keycloak.dump
              target_counts=$(query "$target_host" "$counts_sql")
              if [[ "$source_counts" != "$target_counts" ]]; then
                echo "Source and target row counts differ" >&2
                exit 1
              fi
              printf 'Restoration verified (realms|clients|users): %s\n' "$target_counts"
          env:
            - name: CHECK_ONLY
              value: "false"
            - name: PGDATABASE
              value: keycloak
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: POSTGRES_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1
              memory: 512Mi
          volumeMounts:
            - name: archive
              mountPath: /archive
      volumes:
        - name: archive
          emptyDir:
            sizeLimit: 5Gi

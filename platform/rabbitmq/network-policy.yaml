# RabbitMQ est commun à tous les microservices : AMQP (5672) reste ouvert aux pods de
# tous les namespaces, mais plus aux sources hors cluster (nœuds, réseau externe).
# Les métriques Prometheus (15692) ne sont joignables que depuis le namespace monitoring.
# L'API de management (15672), qui accepte le compte admin, n'est joignable que depuis
# le namespace rabbitmq (Job rabbitmq-provisioning).
# kubectl port-forward passe par le kubelet et n'est pas filtré.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - port: 5672
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 15692
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 15672
          protocol: TCP

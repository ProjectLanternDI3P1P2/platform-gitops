# Replace every REPLACE_* value before production deployment.
global:
  domain: REPLACE_CISO_DOMAIN
  tls: true
  securityContext:
    fsGroup: 1001
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/instance
                  operator: In
                  values: [ciso-assistant]
            topologyKey: kubernetes.io/hostname

serviceAccount:
  create: true
  automountServiceAccountToken: false

backend:
  # Huey still uses SQLite in this chart version, so the backend remains a
  # single replica. PostgreSQL protects the main application database.
  replicas: 1
  env:
    - {name: UV_CACHE_DIR, value: /tmp/uv-cache}
    - {name: XDG_CACHE_HOME, value: /tmp/.cache}
    - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
  huey:
    env:
      - {name: UV_CACHE_DIR, value: /tmp/uv-cache}
      - {name: XDG_CACHE_HOME, value: /tmp/.cache}
      - {name: MPLCONFIGDIR, value: /tmp/matplotlib}
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {cpu: "1", memory: 1Gi}
  config:
    emailAdmin: REPLACE_CISO_ADMIN_EMAIL
    # Temporary capture only: Mailpit does not deliver email to recipients.
    smtp:
      defaultFrom: no-reply@REPLACE_MAIL_DOMAIN
      host: mailpit.platform.svc.cluster.local
      port: 1025
      useTls: false
      useSsl: false
      username: ""
      password: ""
    databaseType: externalPgsql
    djangoSecretKey: ""
    djangoExistingSecretKey: ciso-assistant-prod-secrets
    djangoDebug: false
    chat:
      enabled: false
  persistence:
    # Required by Huey even when the main database is PostgreSQL.
    sqlite:
      enabled: true
      size: 10Gi
      storageClass: REPLACE_WITH_PRODUCTION_STORAGE_CLASS
    localStorage:
      enabled: true
      size: 20Gi
      storageClass: REPLACE_WITH_PRODUCTION_STORAGE_CLASS
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  containerSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}

frontend:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  containerSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities: {drop: ["ALL"]}

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: REPLACE_CLUSTER_ISSUER
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  path: /
  pathType: Prefix
  tls:
    enabled: true
    existingSecret: ciso-assistant-tls

networkPolicy:
  enabled: true
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik

postgresql:
  enabled: false

externalPgsql:
  host: REPLACE_CISO_POSTGRES_HOST
  port: 5432
  database: ciso-assistant
  user: ciso-assistant
  password: ""
  existingSecret: ciso-assistant-postgresql

qdrant:
  enabled: false

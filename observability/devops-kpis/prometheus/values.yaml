fullnameOverride: lantern-kpi
grafana:
  enabled: false
alertmanager:
  enabled: false
defaultRules:
  create: false
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
coreDns:
  enabled: false
kubeDns:
  enabled: false
kubeApiServer:
  enabled: false
kubelet:
  enabled: true
  serviceMonitor:
    tlsConfig:
      insecureSkipVerify: false
    probes: false
    resource: false
    cAdvisor: true
    cAdvisorInterval: 30s
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: keep
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
      - sourceLabels: [container]
        action: keep
        regex: api|player-api|frontend-game|frontend-public
kube-state-metrics:
  collectors: [deployments, nodes, pods]
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}
prometheusOperator:
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}
prometheus:
  service:
    type: ClusterIP
  prometheusSpec:
    scrapeInterval: 30s
    retention: 30d
    retentionSize: 15GB
    enableAdminAPI: false
    enableRemoteWriteReceiver: false
    serviceMonitorNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    resources:
      requests: {cpu: 250m, memory: 768Mi}
      limits: {cpu: "2", memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-stateful
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi

alloy:
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          target_label = "job"
          replacement  = "kubernetes-pods"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          action        = "replace"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
                // env : prod par défaut, dev si le namespace est dev ou finit par -dev
        rule {
          target_label = "env"
          replacement  = "prod"
        }

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          regex         = "(?:.+-)?(dev)"
          target_label  = "env"
        }

        // service : nom du container, puis label "app", puis label "app.kubernetes.io/name"
        // (la dernière règle qui correspond l'emporte)
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "(.+)"
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "service"
        }

        // service_name reste égal au container, comme aujourd'hui (déduit par Loki),
        // pour ne rien changer aux dashboards qui filtrent dessus
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          regex         = "(.+)"
          target_label  = "service_name"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.write.loki_endpoint.receiver]
      }

      loki.write "loki_endpoint" {
        endpoint {
          url = "http://192.168.0.15:3100/loki/api/v1/push"
        }
      }
    create: true
  # No anonymous usage report to stats.grafana.org: the egress policy only
  # allows the Kubernetes API, DNS and Loki.
  enableReporting: false
  mounts:
    varlog: true
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    runAsGroup: 0
    runAsUser: 0

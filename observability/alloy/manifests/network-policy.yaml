# Network isolation of the monitoring namespace (US-20, task 92).
#
# Ingress: nothing may reach the namespace. Alloy only pushes logs; its HTTP
# server (12345: debug UI, configuration, metrics) stays reachable through
# kubectl port-forward, which goes through the kubelet and is not filtered.
# Kubelet probes come from the local node and are allowed by the k3s network
# policy controller (kube-router).
#
# Egress: Alloy may only resolve names, watch pods through the Kubernetes API
# and push to Loki. Any new destination must be added here with a reason.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alloy-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  policyTypes:
    - Egress
  egress:
    # CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API, for discovery.kubernetes. The ClusterIP 10.43.0.1:443 is
    # DNAT-ed to the k3s servers on 6443; both forms are allowed because the
    # policy may be evaluated before or after the translation.
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.0.0/24
      ports:
        - port: 6443
          protocol: TCP
    # Loki (k3s subnet instance). 3100 is the current HTTP endpoint; 443 is the
    # HTTPS entry point planned by task 91. Remove 3100 once Alloy uses HTTPS.
    - to:
        - ipBlock:
            cidr: 192.168.0.15/32
      ports:
        - port: 3100
          protocol: TCP
        - port: 443
          protocol: TCP

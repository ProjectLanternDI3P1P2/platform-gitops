apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailpit-production
  namespace: argocd
spec:
  project: lantern-production
  source:
    repoURL: REPLACE_GIT_REPOSITORY_URL
    targetRevision: REPLACE_GIT_REVISION
    path: charts/mailpit
    helm:
      valueFiles: [values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: platform
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ciso-assistant
  namespace: argocd
spec:
  project: lantern-platform
  sources:
    - repoURL: ghcr.io/intuitem/helm-charts/ce
      chart: ciso-assistant
      targetRevision: 0.11.5
      helm:
        valueFiles: [$values/platform/ciso-assistant/values-dev.yaml]
    - repoURL: __GIT_REPOSITORY_URL__
      targetRevision: __GIT_REVISION__
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ciso-assistant
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]

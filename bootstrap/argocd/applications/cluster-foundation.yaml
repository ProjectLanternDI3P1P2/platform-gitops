apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-foundation
  namespace: argocd
spec:
  project: lantern-platform
  source:
    repoURL: __GIT_REPOSITORY_URL__
    targetRevision: __GIT_REVISION__
    path: clusters/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]


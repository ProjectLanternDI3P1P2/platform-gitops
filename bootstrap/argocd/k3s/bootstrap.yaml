apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lantern-argocd-bootstrap
  namespace: argocd
spec:
  project: lantern-platform-k3s
  source:
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
    path: bootstrap/argocd/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m

# Argo CD project for Lantern microservices on K3s.
# Namespaces are created by the cluster foundation and ApplicationSet sync.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lantern-apps
  namespace: argocd
spec:
  description: Microservices Lantern (cluster K3s)
  sourceRepos:
    - https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
  destinations:
    - namespace: player
      server: https://kubernetes.default.svc
    - namespace: dungeon
      server: https://kubernetes.default.svc
    - namespace: combat
      server: https://kubernetes.default.svc
    - namespace: rewards
      server: https://kubernetes.default.svc
    - namespace: leaderboard
      server: https://kubernetes.default.svc
    - namespace: frontend-game
      server: https://kubernetes.default.svc
    - namespace: frontend-public
      server: https://kubernetes.default.svc

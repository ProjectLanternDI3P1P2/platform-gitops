apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: player
  namespace: argocd
spec:
  project: lantern-apps
  source:
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
    path: apps/player/overlays/k3s
  destination:
    server: https://kubernetes.default.svc
    namespace: player
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: lantern-platform-k3s
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0
      helm:
        releaseName: alloy
        valueFiles:
          - $values/observability/alloy/values-k3s.yaml
    - repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Deliberately no automated sync and no pruning during adoption of the
  # existing Helm release. Review the Argo CD diff before the first sync.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

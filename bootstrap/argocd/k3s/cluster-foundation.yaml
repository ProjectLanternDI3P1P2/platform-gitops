apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-foundation
  namespace: argocd
spec:
  project: lantern-platform-k3s
  source:
    repoURL: https://github.com/ProjectLanternDI3P1P2/platform-gitops.git
    targetRevision: main
    path: clusters/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  # Namespace adoption starts with an operator-reviewed manual sync. Pruning
  # remains disabled until every existing namespace has an identified owner.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false

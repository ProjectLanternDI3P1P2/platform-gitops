apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../platform
patches:
  - target:
      kind: Application
      name: platform
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: refactor/unify-k3s-platform
      - op: replace
        path: /spec/source/path
        value: overlays/platform-review

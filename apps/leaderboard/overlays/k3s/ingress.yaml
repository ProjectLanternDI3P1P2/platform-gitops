# Player profiles remain owned by Player. Leaderboard exposes only event-derived
# statistics, the league table, and operator-gated warehouse rebuilds.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-leaderboard
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: leaderboard-authenticated@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: api.lantern.diiage
      http:
        paths:
          - path: /api/v1/leaderboard
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http
          - path: /api/v1/players
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http
          - path: /api/v1/warehouse/rebuilds
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http
    - host: groupe7.diiage.org
      http:
        paths:
          - path: /api/v1/leaderboard
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http
          - path: /api/v1/players
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http
          - path: /api/v1/warehouse/rebuilds
            pathType: Prefix
            backend:
              service:
                name: leaderboard-api
                port:
                  name: http

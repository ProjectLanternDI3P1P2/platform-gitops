apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-public
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: public.lantern.diiage
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-public
                port:
                  name: http

    - host: groupe7.diiage.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-public
                port:
                  name: http


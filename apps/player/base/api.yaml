# API Player (.NET 10). Ports : 8080 = REST, 8081 = gRPC (interne au cluster).
apiVersion: v1
kind: Service
metadata:
  name: player-api
  labels:
    app.kubernetes.io/name: player-api
spec:
  selector:
    app.kubernetes.io/name: player-api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: player-api
  labels:
    app.kubernetes.io/name: player-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: player-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: player-api
    spec:
      imagePullSecrets:
        - name: dockerhub-pull
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: player-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: player-api
          # le tag est fixé dans overlays/k3s/kustomization.yaml
          image: diiageplayerimage/player-image
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              value: Host=player-db;Port=5432;Database=player;Username=player
            - name: ConnectionStrings__PasswordFile
              value: /run/secrets/db/password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: db-secret
              mountPath: /run/secrets/db
              readOnly: true
      volumes:
        - name: db-secret
          secret:
            secretName: player-db

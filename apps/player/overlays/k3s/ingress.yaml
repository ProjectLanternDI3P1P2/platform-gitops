# Traefik is the single public API entry point. Only Player-owned routes are
# exposed here; gRPC port 8081 remains internal to the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-player
spec:
  ingressClassName: traefik
  rules:
    - host: api.lantern.diiage
      http:
        paths:
          - path: /api/v1/players
            pathType: Prefix
            backend:
              service:
                name: player-api
                port:
                  name: http
          - path: /api/v1/hero-classes
            pathType: Prefix
            backend:
              service:
                name: player-api
                port:
                  name: http
          - path: /hubs/player
            pathType: Prefix
            backend:
              service:
                name: player-api
                port:
                  name: http

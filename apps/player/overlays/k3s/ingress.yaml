# Ingress de DÉMO : expose toute l'API REST (port 8080) sur le réseau interne.
# Le gRPC (8081) n'est pas exposé. Aucune authentification sur ces routes :
# cible d'architecture (ADR-GLOB-003) = seule la Gateway (Traefik + Keycloak) est publique,
# cette route sera retirée.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: player-api-health
spec:
  ingressClassName: traefik
  rules:
    - host: player.lantern.diiage
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: player-api
                port:
                  name: http
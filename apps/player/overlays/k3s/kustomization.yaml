apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: player

resources:
  - ../../base
  - ingress.yaml

# Mode démo temporaire (voir demo-dev-mode.yaml).
patches:
  - path: demo-dev-mode.yaml
  
# The promotion workflow replaces this bootstrap tag with dev-<sha12>.
images:
  - name: registry.lantern.diiage/lantern/player-backend
    newTag: dev-latest

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: player

resources:
  - ../../base
  - ingress.yaml

patches:
  # Mode démo temporaire (voir demo-dev-mode.yaml).
  - path: demo-dev-mode.yaml
  # Origines CORS autorisées (le front).
  - path: cors.yaml
  # Temporaire : image sur Docker Hub (voir dockerhub-image.yaml).
  - path: dockerhub-image.yaml

# Déployer une nouvelle version = changer le tag. Toujours un tag fixe (vX.Y.Z), jamais "latest".
images:
  - name: registry.lantern.diiage/lantern/player-backend
    newName: diiageplayerimage/player-image
    newTag: v1.3.0
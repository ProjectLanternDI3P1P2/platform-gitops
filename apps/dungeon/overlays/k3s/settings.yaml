apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres-rw.database.svc.cluster.local;Port=5432;Database=lantern;Username=dungeon;Search Path=dungeon;Maximum Pool Size=10
            - name: Grpc__Player__Address
              value: http://player-api.player.svc.cluster.local:8081
            - name: Cors__AllowedOrigins__0
              value: http://front.lantern.diiage
            - name: Cors__AllowedOrigins__1
              value: http://public.lantern.diiage

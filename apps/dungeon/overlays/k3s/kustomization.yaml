apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dungeon
namePrefix: dungeon-

resources:
  - ../../../_bases/dotnet-api
  - ingress.yaml
  - diagnostics-ingress.yaml

patches:
  # RabbitMQ commun (voir rabbitmq.yaml).
  - path: rabbitmq.yaml
  - path: settings.yaml

images:
  - name: registry.lantern.diiage/lantern/backend
    newName: registry.lantern.diiage/lantern/dungeon-backend
    newTag: v2.2.0

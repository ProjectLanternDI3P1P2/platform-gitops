# Client de jeu (Nuxt, serveur Node). Port 3000 : pages HTML et /healthz.
# Le navigateur appelle l'API directement : l'adresse de l'API (définie dans
# overlays/k3s/env.yaml) doit être joignable depuis le poste du joueur.
apiVersion: v1
kind: Service
metadata:
  name: frontend-game
  labels:
    app.kubernetes.io/name: frontend-game
spec:
  selector:
    app.kubernetes.io/name: frontend-game
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-game
  labels:
    app.kubernetes.io/name: frontend-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-game
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-game
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: worker
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: frontend-game
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend-game
          # image publique : pas de secret de pull. Le tag est fixé dans overlays/k3s/kustomization.yaml
          image: diiageplayerimage/frontend-game-image
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
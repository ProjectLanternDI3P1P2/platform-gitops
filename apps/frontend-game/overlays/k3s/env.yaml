# Réglages propres au cluster K3s. Ces valeurs sont envoyées au navigateur
# du joueur : ne jamais y mettre de secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-game
spec:
  template:
    spec:
      containers:
        - name: frontend-game
          env:
            - name: NUXT_PUBLIC_API_GATEWAY_URL
              value: http://player.lantern.diiage
            - name: NUXT_PUBLIC_SITE_URL
              value: http://front.lantern.diiage
# Réglages propres au cluster K3s. Ces valeurs sont envoyées au navigateur
# du joueur : ne jamais y mettre de secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-game
spec:
  template:
    spec:
      containers:
        - name: frontend-game
          env:
            - name: NUXT_PUBLIC_API_GATEWAY_URL
              value: https://groupe7.diiage.org
            - name: NUXT_PUBLIC_KEYCLOAK_URL
              value: https://groupe7.diiage.org/auth
            - name: NUXT_PUBLIC_API_VERSION
              value: v1
            - name: NUXT_PUBLIC_SITE_URL
              value: https://groupe7.diiage.org/game
            - name: NUXT_PUBLIC_KEYCLOAK_URL
              value: https://groupe7.diiage.org/auth
            - name: NUXT_PUBLIC_KEYCLOAK_REALM
              value: lantern
            - name: NUXT_PUBLIC_KEYCLOAK_CLIENT_ID
              value: lantern-public

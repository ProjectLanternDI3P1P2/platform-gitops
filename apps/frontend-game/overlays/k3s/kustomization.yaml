apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frontend-game

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: env.yaml

# The promotion workflow replaces this bootstrap tag with main-<sha12>.
images:
  - name: registry.lantern.diiage/lantern/frontend-game
    newTag: dev-latest

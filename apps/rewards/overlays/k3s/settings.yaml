apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ConnectionStrings__DefaultConnection
              value: Host=postgres-rw.database.svc.cluster.local;Port=5432;Database=lantern;Username=reward;Search Path=reward;Maximum Pool Size=10
            - name: Grpc__Placeholder__Address
              value: http://player-api.player.svc.cluster.local:8081